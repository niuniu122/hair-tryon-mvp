[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hair-tryon-mvp"
version = "0.1.0"
description = "Local-only internal hair try-on validation MVP"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
